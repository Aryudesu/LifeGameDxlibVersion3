name: Refine tab state
on:
  push:
    paths:
      - '.github/workflows/refine-tab-state.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tool-panel-tabs
      - name: Apply fix
        run: python3 .github/scripts/fix_tab_memory.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LifeGameDxlibVersion3/Main.cpp
          git commit -m "DRAWとPATTERNの選択状態を個別に保持"
          git push
