name: Fix paste select exclusive
on:
  push:
    branches: [feature/tool-panel-tabs]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tool-panel-tabs
      - name: Apply fix
        run: python tools/fix_paste_select_exclusive.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-paste-select-exclusive.yml tools/fix_paste_select_exclusive.py
          git add LifeGameDxlibVersion3/Main.cpp
          git commit -m "SELECT開始時にPasteモードを解除"
          git push origin HEAD:feature/tool-panel-tabs
