name: Refine tab state
on:
  push:
    paths:
      - '.github/workflows/refine-tab-state.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tool-panel-tabs
      - name: Apply state transition fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('LifeGameDxlibVersion3/Main.cpp')
          s = p.read_text(encoding='utf-8')
          start = s.index('                    panelTab = static_cast<PanelTab>(i);', s.index('for (int i = 0; i < 3 && !handled; ++i)'))
          end_marker = '                    handled = true;\n'
          end = s.index(end_marker, start) + len(end_marker)
          new = '''                    const PanelTab previousTab = panelTab;
                    panelTab = static_cast<PanelTab>(i);

                    // DRAW/PATTERN selections persist across tab switches.
                    // EDIT operations are temporary and are cancelled on exit.
                    if (previousTab == PanelTab::Edit && panelTab != PanelTab::Edit) {
                        selectionMode = false;
                        selection.clear();
                        pasteMode = false;
                        shapeTool = ShapeDrawing::Tool::Cell;
                        shapeDragActive = false;
                        cellStrokeHasLastCell = false;
                    }
                    if (panelTab == PanelTab::Edit) {
                        shapeDragActive = false;
                        cellStrokeHasLastCell = false;
                    }
                    handled = true;
'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
      - name: Commit result
        run: |
          git config user.name "Aryu"
          git config user.email "suwako_a-u-@hotmail.co.jp"
          git add LifeGameDxlibVersion3/Main.cpp
          git commit -m "DRAWとPATTERNのツール選択をタブ間で保持"
          git push
