name: Refine tab state
on:
  push:
    paths:
      - '.github/workflows/refine-tab-state.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tool-panel-tabs
      - name: Apply state transition fix
        shell: python
        run: |
          exec(open('.github/scripts/fix_tab_memory.py', encoding='utf-8').read())
      - name: Commit result
        run: |
          git config user.name "Aryu"
          git config user.email "suwako_a-u-@hotmail.co.jp"
          git add LifeGameDxlibVersion3/Main.cpp
          git commit -m "DRAWとPATTERNの選択状態を個別に保持"
          git push
