name: Apply User Pattern UI
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-patterns
      - run: python tools/apply_user_pattern_ui.py
      - run: |
          git config user.name "Aryu"
          git config user.email "suwako_a-u-@hotmail.co.jp"
          git add LifeGameDxlibVersion3/Main.cpp
          git diff --cached --quiet || git commit -m "選択範囲をユーザーパターンとして登録可能にする"
          git push
