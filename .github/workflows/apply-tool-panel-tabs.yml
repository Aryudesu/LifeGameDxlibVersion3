name: Apply tool panel tabs
on:
  push:
    branches: [feature/tool-panel-tabs]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tool-panel-tabs
      - name: Apply refactor
        run: python tools/apply_panel_refactor.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-tool-panel-tabs.yml tools/apply_panel_refactor.py
          git add LifeGameDxlibVersion3/Main.cpp
          git commit -m "右ツールパネルをDRAW PATTERN EDITタブへ再編"
          git push origin HEAD:feature/tool-panel-tabs
